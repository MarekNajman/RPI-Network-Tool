# NetPanel X11 kiosk on the legacy firmware framebuffer (no KMS driver loaded).
# Forces the plain fbdev driver on /dev/fb0. Installed to /etc/X11/xorg.conf.d/
# only by "install.sh --kiosk-mode x11" on systems without /sys/class/drm/cardN;
# removed again when the installer switches to the KMS/Wayland kiosk.
Section "Device"
    Identifier "NetPanel-fbdev"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "NetPanel-screen"
    Device     "NetPanel-fbdev"
EndSection
